scales:
  small:
    rows_per_table: 10_000
    databases: 2
    tables_per_db: 3
  medium:
    rows_per_table: 1_000_000
    databases: 5
    tables_per_db: 5
  large:
    rows_per_table: 50_000_000
    databases: 10
    tables_per_db: 10
  stress:
    rows_per_table: 500_000_000
    databases: 20
    tables_per_db: 20

output:
  batch_size: 100_000
  format: "direct"

schemas:
  users:
    columns:
      - name: user_id
        type: serial
        primary_key: true
      - name: email
        type: string
        faker: email
      - name: name
        type: string
        faker: name
      - name: created_at
        type: timestamp
        default: now
      - name: updated_at
        type: timestamp
        cdc: true

  orders:
    columns:
      - name: id
        type: serial
        primary_key: true
      - name: user_id
        type: int
        foreign_key: users.user_id
      - name: amount
        type: decimal
        precision: 10
        scale: 2
        faker: pydecimal
        faker_args:
          min_value: 1
          max_value: 10000
      - name: status
        type: enum
        values: [pending, processing, shipped, delivered, cancelled]
      - name: order_date
        type: timestamp
        faker: date_time_this_year
      - name: created_at
        type: timestamp
        default: now
      - name: updated_at
        type: timestamp
        cdc: true

  payments:
    columns:
      - name: payment_id
        type: serial
        primary_key: true
      - name: order_id
        type: int
        foreign_key: orders.id
      - name: amount
        type: decimal
        precision: 10
        scale: 2
      - name: method
        type: enum
        values: [credit_card, debit_card, paypal, bank_transfer, crypto]
      - name: status
        type: enum
        values: [pending, completed, failed, refunded]
      - name: processed_at
        type: timestamp
        nullable: true
      - name: created_at
        type: timestamp
        default: now
      - name: updated_at
        type: timestamp
        cdc: true

  products:
    columns:
      - name: product_id
        type: serial
        primary_key: true
      - name: name
        type: string
        faker: word
      - name: description
        type: text
        faker: paragraph
      - name: price
        type: decimal
        precision: 10
        scale: 2
      - name: category
        type: string
        faker: word
      - name: stock_quantity
        type: int
        default: 0
      - name: created_at
        type: timestamp
        default: now
      - name: updated_at
        type: timestamp
        cdc: true

  inventory:
    columns:
      - name: inventory_id
        type: serial
        primary_key: true
      - name: product_id
        type: int
        foreign_key: products.product_id
      - name: warehouse_code
        type: string
        length: 50
      - name: quantity
        type: int
      - name: last_restocked
        type: timestamp
        nullable: true
      - name: created_at
        type: timestamp
        default: now
      - name: updated_at
        type: timestamp
        cdc: true

mutation:
  update_percentage: 0.1
  delete_percentage: 0.01
  new_rows_percentage: 0.05
