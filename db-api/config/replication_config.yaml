source:
  type: postgres
  driver: psycopg2  # psycopg2, pymssql, pyodbc, mysql.connector
  host: "${PG_HOST}"  # Set via environment or replace with your host
  port: 5432
  secret_name: "DBAPI_REPLICA_DB.PUBLIC.PG_SECRET"
  timezone: "UTC"  # Source database timezone (UTC, America/Los_Angeles, etc.) - critical for CDC watermarks

  databases:
    - name: customer_a_db
      tables:
        - name: users
          primary_key: [user_id]
          cdc_column: updated_at
        - name: orders
          primary_key: [id]
          cdc_column: updated_at
          partition_column: id
          num_partitions: 4
        - name: payments
          primary_key: [payment_id]
          cdc_column: updated_at
        - name: products
          primary_key: [product_id]
          cdc_column: updated_at
        - name: inventory
          primary_key: [inventory_id]
          cdc_column: updated_at

    - name: customer_b_db
      tables:
        - name: users
          primary_key: [user_id]
          cdc_column: updated_at
        - name: orders
          primary_key: [id]
          cdc_column: updated_at
        - name: products
          primary_key: [product_id]
          cdc_column: updated_at
        - name: payments
          primary_key: [payment_id]
          cdc_column: updated_at
        - name: inventory
          primary_key: [inventory_id]
          cdc_column: updated_at

target:
  database: DBAPI_REPLICA_DB
  schema_pattern: "{source_db}_RAW"
  create_if_not_exists: true

orchestration:
  dag_name: "DBAPI_REPLICATION_DAG"
  schedule: "0 */4 * * *"
  timezone: "UTC"
  warehouse: null
  parallelism: 4
  retry_attempts: 2
  user_task_timeout_ms: 3600000
  external_access_integration: "PG_ACCESS_INTEGRATION"

extraction:
  fetch_size: 100000
  query_timeout: 300

monitoring:
  state_schema: "PUBLIC"
  state_table: "_REPLICATION_STATE"
  log_level: "INFO"
